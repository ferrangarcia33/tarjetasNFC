<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17323C;
    --ink-2:#1F4152;
    --ink-3:#28536A;
    --paper:#F4F2E8;
    --paper-dim:#D9D6C7;
    --gold:#D6A419;
    --gold-2:#EFC24E;
    --line:rgba(244,242,232,0.14);

    --s-no-visitado:#7C93A0;
    --s-ya-tenia:#9B7FC7;
    --s-vendido:#4FAE7B;
    --s-no-interesado:#C1584A;
    --s-seguimiento:#4F8FE0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  #status-bar-fill{
    position:fixed;top:0;left:0;right:0;
    height:env(safe-area-inset-top, 0px);
    background:var(--ink);
    z-index:2000;
  }
  body{
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--ink);
    background:var(--paper);
    overflow:hidden;
  }
  h1,h2,h3,.brand,.section-label{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  #app{display:flex;height:100vh;width:100vw;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:360px;
    min-width:360px;
    background:var(--ink);
    color:var(--paper);
    display:flex;
    flex-direction:column;
    height:100%;
    z-index:500;
  }
  #sidebar-header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  #sidebar-close-btn{
    display:none;
    position:absolute;top:14px;right:14px;
    background:rgba(244,242,232,0.08);border:none;color:var(--paper);
    width:30px;height:30px;border-radius:50%;
    align-items:center;justify-content:center;
    font-size:15px;cursor:pointer;
  }
  #sidebar-close-btn:hover{background:rgba(244,242,232,0.16);}
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:8px;
    flex-shrink:0;
    display:block;
    object-fit:cover;
  }
  .tagline{
    margin-top:4px;
    font-size:12.5px;
    color:var(--paper-dim);
    line-height:1.4;
  }

  #search-wrap{padding:14px 20px 0;}
  #search{
    width:100%;
    padding:9px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(244,242,232,0.06);
    color:var(--paper);
    font-family:inherit;
    font-size:13.5px;
    outline:none;
  }
  #search::placeholder{color:var(--paper-dim);}
  #search:focus{border-color:var(--gold);}

  #filters{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:12px 20px 4px;
  }
  .chip{
    padding:5px 10px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:500;
    border:1px solid var(--line);
    background:transparent;
    color:var(--paper-dim);
    cursor:pointer;
    display:flex;align-items:center;gap:5px;
    transition:background .12s, color .12s, border-color .12s;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .chip.active{
    background:var(--paper);
    color:var(--ink);
    border-color:var(--paper);
    font-weight:600;
  }

  #stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--line);
    margin:16px 20px 4px;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .stat{
    background:var(--ink-2);
    padding:10px 8px;
    text-align:center;
  }
  .stat-num{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;color:var(--gold-2);}
  .stat-label{font-size:9.5px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  #list-label{
    padding:16px 20px 8px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--paper-dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  #export-btn{
    background:none;border:none;color:var(--gold-2);
    font-size:11px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;
    text-decoration:underline;text-underline-offset:2px;
  }

  #location-list{
    flex:1;
    overflow-y:auto;
    padding:0 12px 16px;
  }
  #location-list::-webkit-scrollbar{width:6px;}
  #location-list::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:4px;}

  .loc-card{
    padding:10px 10px;
    margin-bottom:4px;
    border-radius:9px;
    cursor:pointer;
    display:flex;
    gap:10px;
    align-items:flex-start;
    transition:background .12s;
  }
  .loc-card:hover, .loc-card.selected{background:rgba(244,242,232,0.07);}
  .loc-marker{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;flex-shrink:0;margin-top:1px;
    border:2px solid rgba(244,242,232,0.25);
  }
  .loc-info{min-width:0;flex:1;}
  .loc-name{font-size:13.5px;font-weight:600;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .loc-meta{font-size:11.5px;color:var(--paper-dim);margin-top:1px;}
  .loc-badge{
    font-size:10px;font-weight:600;margin-top:4px;display:inline-block;
    padding:2px 7px;border-radius:5px;
  }

  #empty-state{
    padding:30px 24px;
    text-align:center;
    color:var(--paper-dim);
    font-size:13px;
    line-height:1.6;
  }

  /* ---------- Map ---------- */
  #map-wrap{flex:1;position:relative;height:100%;}
  #map{height:100%;width:100%;background:var(--paper-dim);}

  .taparuta-pin{
    display:flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50% 50% 50% 4px;
    transform:rotate(-45deg);
    border:2.5px solid var(--paper);
    box-shadow:0 2px 6px rgba(0,0,0,0.35);
  }
  .taparuta-pin span{transform:rotate(45deg);font-size:15px;}
  .taparuta-pin.pending-new{
    border-style:dashed;
    animation:pulse 1.1s infinite;
  }
  @keyframes pulse{0%{transform:rotate(-45deg) scale(1);}50%{transform:rotate(-45deg) scale(1.12);}100%{transform:rotate(-45deg) scale(1);}}

  .qty-badge{
    position:absolute;top:-6px;right:-6px;
    background:var(--ink);color:var(--gold-2);
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;font-weight:600;
    border-radius:8px;padding:1px 5px;
    border:1.5px solid var(--paper);
    transform:rotate(45deg);
  }

  #locate-btn{
    position:absolute;bottom:24px;right:16px;z-index:400;
    background:var(--ink);color:var(--paper);
    border:none;width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.25);
    font-size:17px;
  }

  #hint-banner{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);
    padding:9px 16px;border-radius:999px;
    font-size:12.5px;box-shadow:0 3px 10px rgba(0,0,0,0.25);
    z-index:400;display:none;align-items:center;gap:8px;
    white-space:nowrap;
  }
  #hint-banner .dot-pulse{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse2 1s infinite;}
  @keyframes pulse2{0%,100%{opacity:1;}50%{opacity:.3;}}

  /* ---------- Mobile toggle ---------- */
  #mobile-toggle{display:none;}

  /* ---------- Panel (add / edit) ---------- */
  #overlay{
    position:fixed;inset:0;background:rgba(23,50,60,0.45);
    z-index:900;display:none;
  }
  #panel{
    position:fixed;top:0;right:0;height:100%;width:390px;max-width:92vw;
    background:var(--paper);color:var(--ink);
    z-index:901;box-shadow:-6px 0 24px rgba(0,0,0,0.25);
    transform:translateX(100%);
    transition:transform .22s ease;
    display:flex;flex-direction:column;
  }
  #panel.open{transform:translateX(0);}
  #panel-header{
    padding:20px 22px 14px;
    border-bottom:1px solid var(--paper-dim);
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  #panel-title{font-size:18px;font-weight:700;}
  #panel-coords{font-size:11px;color:#6b7c82;margin-top:3px;}
  #panel-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);line-height:1;}
  #panel-body{flex:1;overflow-y:auto;padding:18px 22px 90px;}

  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:#5c6b70;margin-bottom:6px;font-weight:600;
  }
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=password], .field textarea{
    width:100%;padding:9px 11px;border-radius:7px;border:1.5px solid var(--paper-dim);
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;background:#fff;color:var(--ink);
    outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--ink-3);}
  .field textarea{resize:vertical;min-height:60px;}

  #auth-form .field input[type=text],
  #auth-form .field input[type=password]{
    padding:13px 14px;font-size:16px;border-radius:9px;
  }
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:44px !important;}
  #auth-password-toggle{
    position:absolute;top:50%;right:6px;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;
    font-size:18px;line-height:1;padding:6px;color:#5c6b70;
  }
  #auth-password-toggle:hover{color:var(--ink);}

  .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .option-btn{
    padding:9px 10px;border-radius:8px;border:1.5px solid var(--paper-dim);
    background:#fff;font-size:12.5px;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:7px;font-family:inherit;color:var(--ink);
  }
  .option-btn .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .option-btn.active{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:600;}

  .cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .cat-btn{
    padding:10px 6px;border-radius:8px;border:1.5px solid var(--paper-dim);
    background:#fff;font-size:11.5px;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);
  }
  .cat-btn span{display:block;font-size:17px;margin-bottom:3px;}
  .cat-btn.active{border-color:var(--gold);background:#FBF3DC;font-weight:600;}

  #panel-footer{
    position:absolute;bottom:0;left:0;right:0;
    padding:14px 22px;background:var(--paper);
    border-top:1px solid var(--paper-dim);
    display:flex;gap:10px;
  }
  .btn{
    flex:1;padding:11px 14px;border-radius:8px;border:none;
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:600;
    cursor:pointer;
  }
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-primary:hover{background:var(--ink-3);}
  .btn-danger{background:transparent;color:var(--s-no-interesado);border:1.5px solid var(--s-no-interesado);}
  .btn-danger:hover{background:rgba(193,88,74,0.08);}

  #confirm-overlay{
    position:fixed;inset:0;background:rgba(23,50,60,0.55);
    z-index:950;display:none;
  }
  #confirm-modal{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:340px;max-width:88vw;
    background:var(--paper);color:var(--ink);
    border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.3);
    z-index:951;display:none;padding:20px;
  }
  #confirm-message{font-size:14px;line-height:1.5;margin-bottom:18px;}
  #confirm-actions{display:flex;gap:10px;justify-content:flex-end;}
  #confirm-actions .btn{flex:none;padding:9px 16px;}
  .btn-danger-solid{background:var(--s-no-interesado);color:#fff;}
  .btn-danger-solid:hover{background:#a8483b;}
  #confirm-cancel{background:var(--paper-dim);color:var(--ink);}
  #confirm-cancel:hover{background:#c9c6b6;}

  #menu-btn{
    display:none;
    position:fixed;top:calc(env(safe-area-inset-top, 0px) + 50px);left:16px;z-index:860;
    background:var(--ink);color:var(--paper);
    border:none;width:42px;height:42px;border-radius:50%;
    align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.25);
    font-size:18px;
  }

  @media (max-width: 760px){
    #sidebar{
      position:fixed;left:0;top:0;bottom:0;width:86%;max-width:340px;
      height:100%;
      transform:translateX(-100%);
      transition:transform .25s ease;
      border-radius:0 16px 16px 0;
      z-index:850;
    }
    #sidebar.expanded{transform:translateX(0);}
    #sidebar-header{padding:22px 20px 16px;}
    #sidebar-drag{display:none;}
    #panel{width:100%;max-width:100%;}
    #locate-btn{
      top:calc(env(safe-area-inset-top, 0px) + 50px);
      bottom:auto;right:16px;
    }
    .leaflet-top.leaflet-right{
      top:calc(env(safe-area-inset-top, 0px) + 50px + 42px + 10px) !important;
      right:16px !important;
      z-index:400 !important;
    }
    #menu-btn{display:flex;}
    #sidebar-close-btn{display:flex;}
    .leaflet-top.leaflet-right .leaflet-control-zoom{
      margin:0 !important;
      width:42px;
    }
    .leaflet-top.leaflet-right .leaflet-control-zoom a{
      width:42px;height:42px;line-height:42px;
    }
  }

  /* ---------- Auth screen ---------- */
  #auth-screen{
    position:fixed;inset:0;background:var(--ink);
    z-index:1000;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  #auth-box{
    width:360px;max-width:100%;
    background:var(--ink-2);border-radius:14px;
    padding:28px 26px;color:var(--paper);
  }
  #auth-brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;margin-bottom:6px;}
  #auth-subtitle{font-size:13px;color:var(--paper-dim);margin-bottom:22px;line-height:1.4;}
  #auth-tabs{display:flex;gap:6px;margin-bottom:20px;background:rgba(0,0,0,0.2);border-radius:9px;padding:4px;}
  .auth-tab{
    flex:1;text-align:center;padding:8px;border-radius:6px;cursor:pointer;
    font-size:13px;font-weight:600;color:var(--paper-dim);
  }
  .auth-tab.active{background:var(--gold);color:var(--ink);}
  #auth-error{
    display:none;background:rgba(193,88,74,0.15);color:#e58b7c;
    border:1px solid rgba(193,88,74,0.4);border-radius:7px;
    padding:9px 11px;font-size:12.5px;margin-bottom:14px;line-height:1.4;
  }
  #auth-form .field label{color:var(--paper-dim);}
  #auth-form .field input{background:rgba(244,242,232,0.06);border-color:var(--line);color:var(--paper);}
  #auth-form .field input:focus{border-color:var(--gold);}
  #auth-submit{width:100%;margin-top:4px;background:var(--gold);color:var(--ink);}
  #auth-submit:hover{background:var(--gold-2);}
  #auth-submit:disabled{opacity:0.6;cursor:default;}

  #logout-btn-inline{
    margin-top:10px;background:none;border:none;color:var(--paper-dim);
    font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;
    padding:0;
  }
  #logout-btn-inline:hover{color:var(--paper);}

  #sidebar-overlay{
    display:none;
    position:fixed;inset:0;background:rgba(23,50,60,0.45);
    z-index:840;
  }
  #sidebar-overlay.open{display:block;}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){

  var CATEGORIES = [
    {id:'restaurante', label:'Restaurante', icon:'🍽️'},
    {id:'bar', label:'Bar / Café', icon:'☕'},
    {id:'peluqueria', label:'Peluquería', icon:'💈'},
    {id:'tienda', label:'Tienda', icon:'🛍️'},
    {id:'salud', label:'Salud / Estética', icon:'💆'},
    {id:'otro', label:'Otro', icon:'📍'}
  ];

  var STATUSES = [
    {id:'no_visitado', label:'No visitado', color:'var(--s-no-visitado)'},
    {id:'ya_tenia', label:'Ya tenía NFC', color:'var(--s-ya-tenia)'},
    {id:'vendido', label:'Vendido', color:'var(--s-vendido)'},
    {id:'no_interesado', label:'No interesado', color:'var(--s-no-interesado)'},
    {id:'seguimiento', label:'A repensar', color:'var(--s-seguimiento)'}
  ];

  function catOf(id){ return CATEGORIES.find(function(c){return c.id===id;}) || CATEGORIES[CATEGORIES.length-1]; }
  function statusOf(id){ return STATUSES.find(function(s){return s.id===id;}) || STATUSES[0]; }
  function cssColor(varRef){
    // resolve "var(--x)" against :root
    var name = varRef.replace('var(','').replace(')','');
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  var SUPABASE_URL = 'https://dkzrfijkbvvaibwlpfud.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_Gk9YBrP30J7HRc7sGHgB5Q_oUk8gDaQ';
  var session = null; // {access_token, refresh_token, user}

  function sbHeaders(){
    var token = (session && session.access_token) ? session.access_token : SUPABASE_KEY;
    return {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    };
  }

  function saveSession(s){
    session = s;
    try{ localStorage.setItem('taparuta_session', JSON.stringify(s)); }catch(e){}
  }
  function clearSession(){
    session = null;
    try{ localStorage.removeItem('taparuta_session'); }catch(e){}
  }
  function loadStoredSession(){
    try{
      var raw = localStorage.getItem('taparuta_session');
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function translateAuthError(raw){
    var msg = (raw || '').toLowerCase();
    if(msg.indexOf('invalid login credentials') !== -1) return 'Correo o contraseña incorrectos.';
    if(msg.indexOf('user already registered') !== -1) return 'Ya existe una cuenta con ese correo.';
    if(msg.indexOf('password should be at least') !== -1) return 'La contraseña debe tener al menos 6 caracteres.';
    if(msg.indexOf('unable to validate email') !== -1 || msg.indexOf('invalid format') !== -1) return 'El correo electrónico no es válido.';
    if(msg.indexOf('email not confirmed') !== -1) return 'Debes confirmar tu correo antes de iniciar sesión.';
    if(msg.indexOf('for security purposes') !== -1) return 'Por seguridad, espera unos segundos antes de volver a intentarlo.';
    if(msg.indexOf('network') !== -1 || msg.indexOf('failed to fetch') !== -1) return 'No se pudo conectar. Revisa tu conexión a internet.';
    return 'Ha ocurrido un error. Inténtalo de nuevo.';
  }

  function authRequest(path, body){
    return fetch(SUPABASE_URL + '/auth/v1/' + path, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){
      return r.json().then(function(data){
        if(!r.ok){ throw new Error(data.msg || data.error_description || data.error || 'Error de autenticación'); }
        return data;
      });
    });
  }

  function signUp(email, password){
    return authRequest('signup', {email: email, password: password});
  }
  function signIn(email, password){
    return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({email: email, password: password})
    }).then(function(r){
      return r.json().then(function(data){
        if(!r.ok){ throw new Error(data.msg || data.error_description || data.error || 'Credenciales incorrectas'); }
        return data;
      });
    });
  }

  function refreshSession(){
    if(!session || !session.refresh_token){ return Promise.reject(new Error('no refresh token')); }
    return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({refresh_token: session.refresh_token})
    }).then(function(r){
      return r.json().then(function(data){
        if(!r.ok){ throw new Error('refresh failed'); }
        saveSession({access_token: data.access_token, refresh_token: data.refresh_token, user: data.user});
        return data;
      });
    });
  }

  function forceLogout(){
    clearSession();
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  }

  function sbFetch(url, opts){
    opts = opts || {};
    return fetch(url, opts).then(function(r){
      if(r.status === 401 && session){
        return refreshSession().then(function(){
          var retryOpts = Object.assign({}, opts, {headers: sbHeaders()});
          return fetch(url, retryOpts);
        }).catch(function(){
          forceLogout();
          throw new Error('Sesión expirada. Vuelve a iniciar sesión.');
        });
      }
      return r;
    });
  }

  var locations = [];
  var activeFilter = 'all';
  var searchTerm = '';
  var selectedId = null;
  var pendingLatLng = null;
  var editingId = null;
  var markers = {};
  var pendingMarker = null;

  // ---------------- Map setup ----------------
  var DEFAULT_CENTER = [41.3874, 2.1686]; // Barcelona
  var map = L.map('map', {zoomControl:false, attributionControl:false}).setView(DEFAULT_CENTER, 14);
  L.control.zoom({position: window.innerWidth<=760 ? 'topright' : 'bottomleft'}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19
  }).addTo(map);

  var poiLayer = L.layerGroup().addTo(map);
  var myLocationMarker = null;

  function myLocationIcon(){
    return L.divIcon({
      html: '<div style="width:18px;height:18px;border-radius:50%;background:#4F8FE0;border:3px solid #fff;box-shadow:0 0 0 2px rgba(79,143,224,0.4), 0 2px 6px rgba(0,0,0,0.35);"></div>',
      className: '', iconSize:[18,18], iconAnchor:[9,9]
    });
  }

  document.getElementById('locate-btn').addEventListener('click', function(){
    if(!navigator.geolocation){ map.setView(DEFAULT_CENTER, 14); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      var latlng = [pos.coords.latitude, pos.coords.longitude];
      map.setView(latlng, 15);
      if(myLocationMarker){
        myLocationMarker.setLatLng(latlng);
      } else {
        myLocationMarker = L.marker(latlng, {icon: myLocationIcon(), zIndexOffset: 2000}).addTo(map);
      }
    }, function(){ map.setView(DEFAULT_CENTER, 14); });
  });

  map.on('click', function(e){
    startNewLocation(e.latlng);
  });

  // ---------------- Rendering: filters ----------------
  function renderFilters(){
    var el = document.getElementById('filters');
    el.innerHTML = '';
    var all = document.createElement('div');
    all.className = 'chip' + (activeFilter==='all' ? ' active':'');
    all.textContent = 'Todos';
    all.tabIndex = 0;
    all.setAttribute('role','button');
    all.onclick = function(){ activeFilter='all'; renderAll(); };
    all.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); all.onclick(); } };
    el.appendChild(all);
    STATUSES.forEach(function(s){
      var chip = document.createElement('div');
      chip.className = 'chip' + (activeFilter===s.id ? ' active':'');
      chip.innerHTML = '<span class="dot" style="background:'+cssColor(s.color)+'"></span>' + s.label;
      chip.tabIndex = 0;
      chip.setAttribute('role','button');
      chip.onclick = function(){ activeFilter = s.id; renderAll(); };
      chip.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); chip.onclick(); } };
      el.appendChild(chip);
    });
  }

  // ---------------- Rendering: stats ----------------
  function renderStats(){
    var el = document.getElementById('stats');
    var visited = locations.filter(function(l){return l.status!=='no_visitado';}).length;
    var sold = locations.filter(function(l){return l.status==='vendido';});
    var units = sold.reduce(function(sum,l){return sum + (parseInt(l.units)||0);}, 0);
    var revenue = sold.reduce(function(sum,l){return sum + (parseFloat(l.amount)||0);}, 0);
    var conv = visited>0 ? Math.round((sold.length/visited)*100) : 0;
    var revenueLabel = revenue.toLocaleString('es-ES', {minimumFractionDigits:0, maximumFractionDigits:2});
    el.innerHTML =
      '<div class="stat"><div class="stat-num">'+visited+'</div><div class="stat-label">Visitados</div></div>'+
      '<div class="stat"><div class="stat-num">'+units+'</div><div class="stat-label">Uds. vendidas</div></div>'+
      '<div class="stat"><div class="stat-num">'+conv+'%</div><div class="stat-label">Conversión</div></div>'+
      '<div class="stat"><div class="stat-num">'+revenueLabel+'€</div><div class="stat-label">Ganado</div></div>';
  }

  // ---------------- Rendering: list ----------------
  function filteredLocations(){
    return locations.filter(function(l){
      var matchesFilter = activeFilter==='all' || l.status===activeFilter;
      var matchesSearch = !searchTerm || l.name.toLowerCase().indexOf(searchTerm.toLowerCase())>=0;
      return matchesFilter && matchesSearch;
    }).sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
  }

  function renderList(){
    var list = filteredLocations();
    document.getElementById('list-count').textContent = list.length + (list.length===1 ? ' local' : ' locales');
    var el = document.getElementById('location-list');
    el.innerHTML = '';
    if(locations.length===0){
      el.innerHTML = '<div id="empty-state">Aún no has añadido ningún local.<br>Toca cualquier punto del mapa para registrar tu primera visita.</div>';
      return;
    }
    if(list.length===0){
      el.innerHTML = '<div id="empty-state">Ningún local coincide con este filtro o búsqueda.</div>';
      return;
    }
    list.forEach(function(loc){
      var cat = catOf(loc.category);
      var st = statusOf(loc.status);
      var card = document.createElement('div');
      card.className = 'loc-card' + (loc.id===selectedId ? ' selected' : '');
      var metaBits = [cat.label];
      if(loc.status==='vendido' && loc.units) metaBits.push(loc.units + ' ud.');
      if(loc.status==='vendido' && loc.amount) metaBits.push(loc.amount + '€');
      if(loc.status==='seguimiento' && loc.followUp) metaBits.push('seg. ' + loc.followUp);
      card.innerHTML =
        '<div class="loc-marker" style="background:'+cssColor(st.color)+'"><span>'+cat.icon+'</span></div>'+
        '<div class="loc-info">'+
          '<div class="loc-name">'+escapeHtml(loc.name)+'</div>'+
          '<div class="loc-meta">'+metaBits.join(' · ')+'</div>'+
          '<div class="loc-badge" style="background:'+cssColor(st.color)+'22;color:'+cssColor(st.color)+'">'+st.label+'</div>'+
        '</div>';
      card.onclick = function(){
        selectedId = loc.id;
        map.setView([loc.lat, loc.lng], 17, {animate:true});
        if(markers[loc.id]) markers[loc.id].openPopup();
        openPanel(loc);
        renderList();
      };
      el.appendChild(card);
    });
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  // ---------------- Rendering: markers ----------------
  function pinIcon(loc){
    var cat = catOf(loc.category);
    var st = statusOf(loc.status);
    var badge = (loc.status==='vendido' && loc.units) ? '<div class="qty-badge">×'+loc.units+'</div>' : '';
    var html = '<div style="position:relative;">'+
      '<div class="taparuta-pin" style="background:'+cssColor(st.color)+'"><span>'+cat.icon+'</span></div>'+badge+
    '</div>';
    return L.divIcon({html:html, className:'', iconSize:[34,34], iconAnchor:[17,32], popupAnchor:[0,-30]});
  }

  function renderMarkers(){
    Object.keys(markers).forEach(function(id){ map.removeLayer(markers[id]); });
    markers = {};
    locations.forEach(function(loc){
      var m = L.marker([loc.lat, loc.lng], {icon: pinIcon(loc)}).addTo(map);
      m.on('click', function(){
        selectedId = loc.id;
        openPanel(loc);
        renderList();
      });
      markers[loc.id] = m;
    });
  }

  function renderAll(){
    renderFilters();
    renderStats();
    renderList();
    renderMarkers();
  }

  // ---------------- Supabase data layer ----------------
  function toDb(loc){
    return {
      id: loc.id, name: loc.name, category: loc.category, status: loc.status,
      units: loc.units, amount: loc.amount, follow_up: loc.followUp || null, contact: loc.contact || null,
      notes: loc.notes || null, lat: loc.lat, lng: loc.lng,
      created_at: loc.createdAt, updated_at: loc.updatedAt
    };
  }
  function fromDb(row){
    return {
      id: row.id, name: row.name, category: row.category, status: row.status,
      units: row.units, amount: row.amount, followUp: row.follow_up, contact: row.contact,
      notes: row.notes, lat: row.lat, lng: row.lng,
      createdAt: row.created_at, updatedAt: row.updated_at
    };
  }

  function showSyncError(msg){
    showHintTimed(msg, 5000);
  }

  function loadLocations(){
    sbFetch(SUPABASE_URL + '/rest/v1/locations?select=*', {headers: sbHeaders()})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(rows){
        locations = rows.map(fromDb);
        renderAll();
        if(locations.length===0){
          showHintTimed('Toca cualquier punto del mapa para registrar tu primera visita', 5000);
        }
      })
      .catch(function(err){
        console.error('Supabase load error', err);
        locations = [];
        renderAll();
        showSyncError('No se pudo conectar con la base de datos. Revisa tu conexión.');
      });
  }

  function insertLocation(loc){
    return sbFetch(SUPABASE_URL + '/rest/v1/locations', {
      method: 'POST',
      headers: Object.assign({}, sbHeaders(), {'Prefer':'return=representation'}),
      body: JSON.stringify([toDb(loc)])
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(rows){
      return fromDb(rows[0]);
    });
  }

  function updateLocation(id, patch){
    var dbPatch = {};
    if('name' in patch) dbPatch.name = patch.name;
    if('category' in patch) dbPatch.category = patch.category;
    if('status' in patch) dbPatch.status = patch.status;
    if('units' in patch) dbPatch.units = patch.units;
    if('amount' in patch) dbPatch.amount = patch.amount;
    if('followUp' in patch) dbPatch.follow_up = patch.followUp;
    if('contact' in patch) dbPatch.contact = patch.contact;
    if('notes' in patch) dbPatch.notes = patch.notes;
    if('updatedAt' in patch) dbPatch.updated_at = patch.updatedAt;
    return sbFetch(SUPABASE_URL + '/rest/v1/locations?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: sbHeaders(),
      body: JSON.stringify(dbPatch)
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
    });
  }

  function deleteLocationRemote(id){
    return sbFetch(SUPABASE_URL + '/rest/v1/locations?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: sbHeaders()
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
    });
  }

  // ---------------- Panel logic ----------------
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');

  function showHint(text){
    var banner = document.getElementById('hint-banner');
    document.getElementById('hint-text').textContent = text;
    banner.style.display = 'flex';
  }
  function hideHint(){
    document.getElementById('hint-banner').style.display = 'none';
  }
  var hintTimer = null;
  function showHintTimed(text, duration){
    if(hintTimer){ clearTimeout(hintTimer); }
    showHint(text);
    hintTimer = setTimeout(function(){ hideHint(); hintTimer = null; }, duration);
  }

  function startNewLocation(latlng, prefill){
    editingId = null;
    pendingLatLng = latlng;
    if(pendingMarker) map.removeLayer(pendingMarker);
    pendingMarker = L.marker(latlng, {
      icon: L.divIcon({html:'<div class="taparuta-pin pending-new" style="background:'+cssColor(statusOf('no_visitado').color)+'"><span>📍</span></div>', className:'', iconSize:[34,34], iconAnchor:[17,32]})
    }).addTo(map);

    document.getElementById('panel-title').textContent = 'Nuevo local';
    document.getElementById('panel-coords').textContent = latlng.lat.toFixed(5) + ', ' + latlng.lng.toFixed(5);
    document.getElementById('f-name').style.borderColor = '';
    document.getElementById('f-name').value = prefill && prefill.name ? prefill.name : '';
    document.getElementById('f-contact').value = '';
    document.getElementById('f-notes').value = '';
    document.getElementById('f-units').value = '';
    document.getElementById('f-amount').value = '';
    document.getElementById('f-followup').value = '';
    document.getElementById('btn-delete').style.display = 'none';
    setCategory(prefill && prefill.category ? prefill.category : 'otro');
    setStatus('no_visitado');
    openPanelRaw();
    if(!prefill || !prefill.name){ document.getElementById('f-name').focus(); }
  }

  function openPanel(loc){
    editingId = loc.id;
    pendingLatLng = null;
    if(pendingMarker){ map.removeLayer(pendingMarker); pendingMarker = null; }
    document.getElementById('panel-title').textContent = 'Editar local';
    document.getElementById('panel-coords').textContent = loc.lat.toFixed(5) + ', ' + loc.lng.toFixed(5);
    document.getElementById('f-name').style.borderColor = '';
    document.getElementById('f-name').value = loc.name || '';
    document.getElementById('f-contact').value = loc.contact || '';
    document.getElementById('f-notes').value = loc.notes || '';
    document.getElementById('f-units').value = loc.units || '';
    document.getElementById('f-amount').value = (loc.amount !== null && loc.amount !== undefined) ? loc.amount : '';
    document.getElementById('f-followup').value = loc.followUp || '';
    document.getElementById('btn-delete').style.display = 'block';
    setCategory(loc.category);
    setStatus(loc.status);
    openPanelRaw();
  }

  function openPanelRaw(){
    overlay.style.display = 'block';
    panel.classList.add('open');
  }

  // ---------------- Custom confirm dialog ----------------
  var confirmOverlay = document.getElementById('confirm-overlay');
  var confirmModal = document.getElementById('confirm-modal');
  var confirmMessage = document.getElementById('confirm-message');
  var confirmAccept = document.getElementById('confirm-accept');
  var confirmCancel = document.getElementById('confirm-cancel');

  function showConfirm(message){
    return new Promise(function(resolve){
      confirmMessage.textContent = message;
      confirmOverlay.style.display = 'block';
      confirmModal.style.display = 'block';
      function cleanup(result){
        confirmOverlay.style.display = 'none';
        confirmModal.style.display = 'none';
        confirmAccept.removeEventListener('click', onAccept);
        confirmCancel.removeEventListener('click', onCancel);
        confirmOverlay.removeEventListener('click', onCancel);
        resolve(result);
      }
      function onAccept(){ cleanup(true); }
      function onCancel(){ cleanup(false); }
      confirmAccept.addEventListener('click', onAccept);
      confirmCancel.addEventListener('click', onCancel);
      confirmOverlay.addEventListener('click', onCancel);
    });
  }
  function closePanel(){
    overlay.style.display = 'none';
    panel.classList.remove('open');
    if(pendingMarker){ map.removeLayer(pendingMarker); pendingMarker = null; }
    pendingLatLng = null;
    editingId = null;
  }

  document.getElementById('panel-close').onclick = closePanel;
  overlay.onclick = closePanel;

  var currentCategory = 'otro';
  var currentStatus = 'no_visitado';

  function buildCategoryGrid(){
    var el = document.getElementById('f-category');
    el.innerHTML = '';
    CATEGORIES.forEach(function(c){
      var b = document.createElement('div');
      b.className = 'cat-btn';
      b.dataset.id = c.id;
      b.innerHTML = '<span>'+c.icon+'</span>'+c.label;
      b.tabIndex = 0;
      b.setAttribute('role','button');
      b.onclick = function(){ setCategory(c.id); };
      b.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); b.onclick(); } };
      el.appendChild(b);
    });
  }
  function setCategory(id){
    currentCategory = id;
    document.querySelectorAll('#f-category .cat-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.id===id);
    });
  }

  function buildStatusGrid(){
    var el = document.getElementById('f-status');
    el.innerHTML = '';
    STATUSES.forEach(function(s){
      var b = document.createElement('div');
      b.className = 'option-btn';
      b.dataset.id = s.id;
      b.innerHTML = '<span class="dot" style="background:'+cssColor(s.color)+'"></span>'+s.label;
      b.tabIndex = 0;
      b.setAttribute('role','button');
      b.onclick = function(){ setStatus(s.id); };
      b.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); b.onclick(); } };
      el.appendChild(b);
    });
  }
  function setStatus(id){
    currentStatus = id;
    document.querySelectorAll('#f-status .option-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.id===id);
    });
    document.getElementById('f-units-wrap').style.display = (id==='vendido') ? 'block' : 'none';
    document.getElementById('f-amount-wrap').style.display = (id==='vendido') ? 'block' : 'none';
    document.getElementById('f-followup-wrap').style.display = (id==='seguimiento') ? 'block' : 'none';
  }

  buildCategoryGrid();
  buildStatusGrid();

  document.getElementById('btn-save').onclick = function(){
    var name = document.getElementById('f-name').value.trim();
    if(!name){
      document.getElementById('f-name').style.borderColor = 'var(--s-no-interesado)';
      document.getElementById('f-name').focus();
      return;
    }
    document.getElementById('f-name').style.borderColor = '';
    var now = Date.now();
    var saveBtn = document.getElementById('btn-save');
    var originalLabel = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Guardando...';

    if(editingId){
      var loc = locations.find(function(l){return l.id===editingId;});
      var patch = {
        name: name,
        category: currentCategory,
        status: currentStatus,
        units: currentStatus==='vendido' ? (parseInt(document.getElementById('f-units').value)||1) : null,
        amount: currentStatus==='vendido' ? (parseFloat(document.getElementById('f-amount').value)||0) : null,
        followUp: currentStatus==='seguimiento' ? document.getElementById('f-followup').value : null,
        contact: document.getElementById('f-contact').value.trim(),
        notes: document.getElementById('f-notes').value.trim(),
        updatedAt: now
      };
      updateLocation(editingId, patch).then(function(){
        Object.assign(loc, patch);
        closePanel();
        renderAll();
      }).catch(function(err){
        console.error('Update error', err);
        showSyncError('No se pudo guardar el cambio. Comprueba tu conexión e inténtalo de nuevo.');
      }).finally(function(){
        saveBtn.disabled = false;
        saveBtn.textContent = originalLabel;
      });
    } else {
      var newLoc = {
        id: 'loc_' + now + '_' + Math.random().toString(36).slice(2,7),
        lat: pendingLatLng.lat,
        lng: pendingLatLng.lng,
        name: name,
        category: currentCategory,
        status: currentStatus,
        units: currentStatus==='vendido' ? (parseInt(document.getElementById('f-units').value)||1) : null,
        amount: currentStatus==='vendido' ? (parseFloat(document.getElementById('f-amount').value)||0) : null,
        followUp: currentStatus==='seguimiento' ? document.getElementById('f-followup').value : null,
        contact: document.getElementById('f-contact').value.trim(),
        notes: document.getElementById('f-notes').value.trim(),
        createdAt: now,
        updatedAt: now
      };
      insertLocation(newLoc).then(function(saved){
        locations.push(saved);
        closePanel();
        renderAll();
      }).catch(function(err){
        console.error('Insert error', err);
        showSyncError('No se pudo guardar el local. Comprueba tu conexión e inténtalo de nuevo.');
      }).finally(function(){
        saveBtn.disabled = false;
        saveBtn.textContent = originalLabel;
      });
    }
  };

  document.getElementById('btn-delete').onclick = function(){
    if(!editingId) return;
    var loc = locations.find(function(l){return l.id===editingId;});
    var name = loc ? loc.name : 'este local';
    showConfirm('¿Seguro que quieres eliminar "' + name + '"? Esta acción no se puede deshacer.').then(function(confirmed){
      if(!confirmed) return;
      var delBtn = document.getElementById('btn-delete');
      delBtn.disabled = true;
      deleteLocationRemote(editingId).then(function(){
        locations = locations.filter(function(l){return l.id!==editingId;});
        closePanel();
        renderAll();
      }).catch(function(err){
        console.error('Delete error', err);
        showSyncError('No se pudo eliminar el local. Comprueba tu conexión e inténtalo de nuevo.');
      }).finally(function(){
        delBtn.disabled = false;
      });
    });
  };

  // ---------------- Search ----------------
  document.getElementById('search').addEventListener('input', function(e){
    searchTerm = e.target.value;
    renderList();
  });

  // ---------------- Export CSV ----------------
  document.getElementById('export-btn').onclick = function(){
    if(locations.length===0) return;
    var rows = [['Nombre','Categoria','Estado','Unidades vendidas','Dinero ganado (€)','Seguimiento','Contacto','Notas','Lat','Lng']];
    locations.forEach(function(l){
      rows.push([l.name, catOf(l.category).label, statusOf(l.status).label, l.units||'', l.amount||'', l.followUp||'', l.contact||'', (l.notes||'').replace(/\n/g,' '), l.lat, l.lng]);
    });
    var csv = rows.map(function(r){
      return r.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(',');
    }).join('\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'taparuta_locales.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // ---------------- Auth screen ----------------
  var authMode = 'signin';
  var authTabs = document.querySelectorAll('.auth-tab');
  var authError = document.getElementById('auth-error');
  var authSubmit = document.getElementById('auth-submit');
  var authEmail = document.getElementById('auth-email');
  var authPassword = document.getElementById('auth-password');
  var authPasswordToggle = document.getElementById('auth-password-toggle');

  authPasswordToggle.addEventListener('click', function(){
    var isHidden = authPassword.type === 'password';
    authPassword.type = isHidden ? 'text' : 'password';
    authPasswordToggle.textContent = isHidden ? '🙈' : '👁';
    authPasswordToggle.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
  });

  authTabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      authMode = tab.dataset.mode;
      authTabs.forEach(function(t){ t.classList.toggle('active', t===tab); });
      authSubmit.textContent = authMode==='signin' ? 'Iniciar sesión' : 'Crear cuenta';
      authError.style.display = 'none';
    });
  });

  function showAuthError(msg){
    authError.textContent = msg;
    authError.style.display = 'block';
  }

  function enterApp(){
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    map.invalidateSize();
    loadLocations();
  }

  authSubmit.addEventListener('click', function(){
    var email = authEmail.value.trim();
    var password = authPassword.value;
    authError.style.display = 'none';
    if(!email || !password){
      showAuthError('Rellena correo y contraseña.');
      return;
    }
    if(password.length < 6){
      showAuthError('La contraseña debe tener al menos 6 caracteres.');
      return;
    }
    authSubmit.disabled = true;
    var originalText = authSubmit.textContent;
    authSubmit.textContent = 'Un momento...';

    var action = authMode==='signin' ? signIn(email, password) : signUp(email, password);
    action.then(function(data){
      if(data.access_token){
        saveSession({access_token: data.access_token, refresh_token: data.refresh_token, user: data.user});
        enterApp();
      } else {
        // Sign-up succeeded but email confirmation is required
        showAuthError('Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.');
      }
    }).catch(function(err){
      showAuthError(translateAuthError(err.message));
    }).finally(function(){
      authSubmit.disabled = false;
      authSubmit.textContent = originalText;
    });
  });

  document.getElementById('logout-btn-inline').addEventListener('click', function(e){
    e.stopPropagation();
    clearSession();
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
    authEmail.value = '';
    authPassword.value = '';
    locations = [];
  });

  // ---------------- Mobile sidebar toggle ----------------
  var sidebarEl = document.getElementById('sidebar');
  var sidebarOverlay = document.getElementById('sidebar-overlay');
  var menuBtn = document.getElementById('menu-btn');
  var sidebarCloseBtn = document.getElementById('sidebar-close-btn');

  function openMobileSidebar(){
    sidebarEl.classList.add('expanded');
    sidebarOverlay.classList.add('open');
    menuBtn.style.display = 'none';
  }
  function closeMobileSidebar(){
    sidebarEl.classList.remove('expanded');
    sidebarOverlay.classList.remove('open');
    menuBtn.style.display = '';
  }

  menuBtn.addEventListener('click', openMobileSidebar);
  sidebarOverlay.addEventListener('click', closeMobileSidebar);
  sidebarCloseBtn.addEventListener('click', closeMobileSidebar);

  // ---------------- Init ----------------
  var storedSession = loadStoredSession();
  if(storedSession && storedSession.access_token){
    session = storedSession;
    enterApp();
  }

})();
</script>
</body>
</html>
